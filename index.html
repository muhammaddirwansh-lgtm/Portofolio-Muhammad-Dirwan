<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Portofolio Eksekutif - Modern Corporate Showcase</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700;800&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --bg-glass-hero: rgba(11, 19, 43, 0.65);
            --bg-glass-card: rgba(255, 255, 255, 0.93);
            --text-main: #0F172A;
            --text-muted: #475569;
            --text-light: #F8FAFC;
            
            --maroon-primary: #7A001E;
            --maroon-dark: #4A0012;
            --maroon-soft: rgba(122, 0, 30, 0.08);
            
            --gold-primary: #C5A059;
            --gold-hover: #D4AF37;
            --gold-light: rgba(197, 160, 89, 0.15);
            --border-gold: rgba(197, 160, 89, 0.4);
            
            --border-light: rgba(226, 232, 240, 0.8);
            --danger: #DC2626;
            --success: #16A34A;
            
            --radius-md: 12px;
            --radius-lg: 20px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Plus Jakarta Sans', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: #0B132B;
            color: var(--text-main);
            line-height: 1.6;
            position: relative;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* Loading Screen untuk Mencegah Flicker Teks Default */
        #appLoader {
            position: fixed;
            inset: 0;
            background: #0B132B;
            z-index: 99999;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: #FFFFFF;
            transition: opacity 0.3s ease, visibility 0.3s ease;
        }
        #appLoader.hidden {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }
        .spinner {
            width: 48px;
            height: 48px;
            border: 4px solid rgba(197, 160, 89, 0.2);
            border-top-color: var(--gold-primary);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-bottom: 16px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        .body-bg-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: linear-gradient(135deg, rgba(11, 19, 43, 0.88) 0%, rgba(74, 0, 18, 0.82) 100%),
                        url('https://images.unsplash.com/photo-1486406146926-c627a92ad1ab?auto=format&fit=crop&w=2000&q=80') center/cover no-repeat fixed;
            z-index: -1;
        }

        a { text-decoration: none; color: inherit; }

        .container {
            max-width: 1160px;
            margin: 0 auto;
            padding: 0 24px;
        }

        /* Header Navigasi */
        header {
            position: sticky;
            top: 0;
            background: rgba(11, 19, 43, 0.85);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-bottom: 1px solid var(--border-gold);
            z-index: 100;
        }

        .nav-inner {
            display: flex;
            justify-content: space-between;
            align-items: center;
            height: 76px;
        }

        .logo { 
            font-family: 'Playfair Display', serif;
            font-size: 1.5rem; 
            font-weight: 800; 
            color: #FFFFFF; 
            letter-spacing: 0.5px;
        }
        .logo span { color: var(--gold-primary); }

        .nav-links {
            display: flex;
            gap: 20px;
            align-items: center;
            list-style: none;
        }

        .nav-links a {
            font-size: 0.88rem;
            font-weight: 600;
            color: rgba(255, 255, 255, 0.85);
            transition: color 0.2s ease;
        }

        .nav-links a:hover { color: var(--gold-primary); }

        .menu-toggle {
            display: none;
            background: none;
            border: none;
            color: #FFFFFF;
            font-size: 1.5rem;
            cursor: pointer;
            padding: 6px;
        }

        /* Tombol Aksi */
        .btn-primary {
            background: linear-gradient(135deg, var(--maroon-primary) 0%, var(--maroon-dark) 100%);
            color: #FFFFFF !important;
            padding: 12px 24px;
            border-radius: var(--radius-md);
            font-weight: 600;
            transition: all 0.3s ease;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            cursor: pointer;
            border: 1px solid var(--gold-primary);
            font-size: 0.9rem;
            box-shadow: 0 4px 15px rgba(122, 0, 30, 0.3);
            white-space: nowrap;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 22px rgba(122, 0, 30, 0.45);
        }

        .btn-save-db {
            background: linear-gradient(135deg, #16A34A 0%, #15803D 100%);
            color: #FFFFFF !important;
            padding: 12px 24px;
            border-radius: var(--radius-md);
            font-weight: 600;
            transition: all 0.3s ease;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            cursor: pointer;
            border: 1px solid rgba(255, 255, 255, 0.3);
            font-size: 0.9rem;
            box-shadow: 0 4px 15px rgba(22, 163, 74, 0.3);
            white-space: nowrap;
        }

        .btn-save-db:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 22px rgba(22, 163, 74, 0.45);
        }

        .bottom-action-container {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 16px;
            margin: 40px 0 60px;
            padding: 24px;
            background: var(--bg-glass-hero);
            backdrop-filter: blur(16px);
            border: 1px solid var(--border-gold);
            border-radius: var(--radius-lg);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
            flex-wrap: wrap;
        }

        .btn-add {
            background: rgba(255, 255, 255, 0.95);
            color: var(--maroon-primary);
            border: 1px solid var(--border-gold);
            padding: 7px 14px;
            border-radius: var(--radius-md);
            font-size: 0.82rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s ease;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .btn-add:hover { 
            background: var(--maroon-primary); 
            color: #FFFFFF;
        }

        .btn-nav-scroll {
            background: rgba(255, 255, 255, 0.9);
            border: 1px solid var(--border-gold);
            color: var(--maroon-primary);
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn-nav-scroll:hover {
            background: var(--maroon-primary);
            color: #FFFFFF;
        }

        .btn-delete-item {
            position: absolute;
            top: 12px;
            right: 12px;
            background: rgba(220, 38, 38, 0.9);
            color: #FFFFFF;
            border: none;
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 0.75rem;
            font-weight: 600;
            cursor: pointer;
            z-index: 5;
        }

        /* Firebase Status Indicator */
        .db-status-bar {
            background: rgba(15, 23, 42, 0.9);
            color: #E2E8F0;
            border-bottom: 1px solid rgba(197, 160, 89, 0.3);
            padding: 6px 0;
            font-size: 0.8rem;
            text-align: center;
        }
        .db-status-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-weight: 600;
        }
        .db-status-badge .indicator {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background-color: #94A3B8;
        }
        .db-status-badge.connected .indicator { background-color: #22C55E; box-shadow: 0 0 8px #22C55E; }
        .db-status-badge.saving .indicator { background-color: #EAB308; box-shadow: 0 0 8px #EAB308; }
        .db-status-badge.error .indicator { background-color: #EF4444; box-shadow: 0 0 8px #EF4444; }

        /* HERO / PROFIL UTAMA */
        .hero { padding: 40px 0 28px; }

        .hero-card {
            background: var(--bg-glass-hero);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--border-gold);
            border-top: 4px solid var(--gold-primary);
            border-radius: var(--radius-lg);
            padding: 36px;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.4);
            color: var(--text-light);
        }

        .hero-grid {
            display: grid;
            grid-template-columns: 210px 1fr;
            gap: 36px;
            align-items: center;
        }

        .profile-photo-box {
            position: relative;
            width: 200px;
            height: 200px;
            border-radius: 50%;
            overflow: hidden;
            border: 3px solid var(--gold-primary);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            background: #1E293B;
            margin: 0 auto;
        }

        .profile-photo-box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .profile-upload-overlay {
            position: absolute;
            inset: 0;
            background: rgba(122, 0, 30, 0.85);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 6px;
            color: #FFFFFF;
            font-size: 0.85rem;
            font-weight: 600;
            opacity: 0;
            transition: opacity 0.25s ease;
            cursor: pointer;
        }

        .profile-photo-box:hover .profile-upload-overlay { opacity: 1; }

        .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background-color: rgba(197, 160, 89, 0.2);
            color: var(--gold-hover);
            padding: 4px 14px;
            border-radius: 20px;
            font-size: 0.82rem;
            font-weight: 700;
            border: 1px solid var(--border-gold);
            margin-bottom: 14px;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            background-color: var(--gold-primary);
            border-radius: 50%;
            box-shadow: 0 0 10px var(--gold-primary);
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.4; transform: scale(1.2); }
            100% { opacity: 1; transform: scale(1); }
        }

        .hero-title {
            font-family: 'Playfair Display', serif;
            font-size: 2.5rem;
            font-weight: 800;
            line-height: 1.15;
            color: #FFFFFF;
            margin-bottom: 4px;
            letter-spacing: -0.5px;
        }

        .hero-subtitle {
            font-size: 1.2rem;
            color: var(--gold-primary);
            font-weight: 700;
            margin-bottom: 14px;
        }

        .hero-bio {
            font-size: 0.96rem;
            color: rgba(255, 255, 255, 0.88);
            line-height: 1.65;
            margin-bottom: 20px;
        }

        .contact-info-group {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 18px;
        }

        .contact-pill {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 6px 12px;
            border-radius: 8px;
            font-size: 0.85rem;
            font-weight: 600;
            color: #FFFFFF;
        }

        .contact-pill a {
            color: var(--gold-primary);
            transition: transform 0.2s ease;
        }

        .contact-pill a:hover {
            transform: scale(1.15);
            color: #FFFFFF;
        }

        .social-group {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            align-items: center;
            border-top: 1px dashed rgba(197, 160, 89, 0.3);
            padding-top: 16px;
        }

        .social-link-pill {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(197, 160, 89, 0.15);
            color: #FFFFFF;
            border: 1px solid var(--border-gold);
            padding: 5px 12px;
            border-radius: 8px;
            font-size: 0.82rem;
            font-weight: 600;
            transition: all 0.2s ease;
        }

        .social-link-pill a {
            color: var(--gold-primary);
            transition: color 0.2s ease;
        }

        .social-link-pill a:hover {
            color: #FFFFFF;
        }

        /* Section Layout */
        .section { margin-bottom: 40px; }

        .section-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 16px;
            background: rgba(11, 19, 43, 0.65);
            backdrop-filter: blur(12px);
            padding: 12px 18px;
            border-radius: var(--radius-md);
            border-left: 4px solid var(--gold-primary);
            border-right: 1px solid var(--border-gold);
            flex-wrap: wrap;
            gap: 12px;
        }

        .section-title-group {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .section-title { 
            font-family: 'Playfair Display', serif;
            font-size: 1.35rem; 
            font-weight: 700; 
            color: #FFFFFF;
        }

        .section-icon { color: var(--gold-primary); font-size: 1.2rem; }

        .section-controls {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        /* KARTU SLIDE */
        .cards-scroll-container {
            display: flex;
            gap: 20px;
            overflow-x: auto;
            padding: 10px 65px 20px 5px;
            scroll-snap-type: x mandatory;
            scroll-behavior: smooth;
            -webkit-overflow-scrolling: touch;
            min-height: 200px;
        }

        .cards-scroll-container::-webkit-scrollbar { height: 6px; }
        .cards-scroll-container::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.15);
            border-radius: 10px;
        }
        .cards-scroll-container::-webkit-scrollbar-thumb {
            background: var(--gold-primary);
            border-radius: 10px;
        }

        .card-horizontal {
            flex: 0 0 330px;
            scroll-snap-align: start;
            background: var(--bg-glass-card);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--border-gold);
            border-top: 4px solid var(--maroon-primary);
            border-radius: var(--radius-lg);
            padding: 18px;
            box-shadow: 
                0 12px 28px -5px rgba(0, 0, 0, 0.35),
                8px 0 18px -5px rgba(0, 0, 0, 0.15);
            position: relative;
            transition: all 0.3s ease;
            display: flex;
            flex-direction: column;
            user-select: none;
        }

        .card-horizontal:hover { 
            border-color: var(--gold-primary);
            transform: translateY(-4px);
            z-index: 10;
        }

        .photo-box-top {
            position: relative;
            width: 100%;
            height: 160px;
            border-radius: var(--radius-md);
            overflow: hidden;
            border: 1px solid var(--border-gold);
            background: #E2E8F0;
            margin-bottom: 12px;
        }

        .photo-box-top img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .photo-slide-hint {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: linear-gradient(to top, rgba(11, 19, 43, 0.9), rgba(11, 19, 43, 0));
            padding: 10px 10px 6px;
            display: flex;
            align-items: center;
            justify-content: flex-end;
            gap: 6px;
            color: var(--gold-hover);
            font-size: 0.74rem;
            font-weight: 700;
            letter-spacing: 0.3px;
            pointer-events: none;
        }

        .photo-slide-hint i {
            animation: arrowPulse 1.8s infinite;
            color: #FFFFFF;
        }

        @keyframes arrowPulse {
            0%, 100% { transform: translateX(0); }
            50% { transform: translateX(5px); }
        }

        .photo-upload-overlay {
            position: absolute;
            inset: 0;
            background: rgba(122, 0, 30, 0.85);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 4px;
            color: #FFFFFF;
            font-size: 0.8rem;
            font-weight: 600;
            opacity: 0;
            transition: opacity 0.2s ease;
            cursor: pointer;
            z-index: 2;
        }

        .photo-box-top:hover .photo-upload-overlay { opacity: 1; }

        .item-title {
            font-size: 1.05rem;
            font-weight: 700;
            color: var(--maroon-primary);
            margin-bottom: 2px;
        }

        .item-subtitle {
            font-size: 0.88rem;
            color: var(--gold-hover);
            font-weight: 700;
            margin-bottom: 6px;
        }

        .date-badge {
            display: inline-block;
            background: var(--gold-light);
            padding: 2px 8px;
            border-radius: 6px;
            font-size: 0.76rem;
            font-weight: 700;
            color: var(--maroon-primary);
            border: 1px solid var(--border-gold);
            margin-bottom: 8px;
            align-self: flex-start;
        }

        .item-desc {
            color: var(--text-muted);
            font-size: 0.86rem;
            line-height: 1.5;
            flex-grow: 1;
        }

        .item-desc ul { padding-left: 16px; }

        .card-footer-hint {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-top: 12px;
            padding-top: 8px;
            border-top: 1px solid rgba(197, 160, 89, 0.25);
            font-size: 0.74rem;
            font-weight: 700;
            color: var(--maroon
